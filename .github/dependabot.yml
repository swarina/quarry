version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
    schedule:
      interval: weekly
      day: monday
    # Wait before proposing fresh releases; matches minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
