version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
      day: monday
    # Wait before proposing fresh releases; matches minimumReleaseAge in pnpm-workspace.yaml.
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Node's type definitions track the Node.js major in .node-version. A newer major would
      # type-check APIs the runtime doesn't have; it moves with the Node.js upgrade instead.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
