name: Pipeline

on:
  schedule:
    # Once a day, off the top of the hour (when GitHub delays scheduled runs), after the
    # 00:00 UTC reset of Cloudflare's daily limits.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Start with an empty store. Only allowed while no snapshot exists yet.
        type: boolean
        default: false
      max-boards:
        description: Crawl at most this many boards (leave empty for all)
        type: string
        default: ""
      dry-run:
        description: Crawl into a throwaway store; restore, save, and alert on nothing (no key needed)
        type: boolean
        default: false
      enrich-budget-usd:
        description: Most to spend answering questions about postings (leave empty for the daily cap)
        type: string
        default: ""

permissions: {}

# Runs never overlap, and a queued run waits instead of cancelling the one in progress.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Runs third-party npm code, so it can read the repository but not write to it.
    permissions:
      contents: read
    outputs:
      packed: ${{ steps.pack.outcome == 'success' }}
      indexed: ${{ steps.index.outcome == 'success' }}
    steps:
      - name: Choose working paths
        run: |
          echo "STORE=$RUNNER_TEMP/store.sqlite" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install runtime dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Restore the store
        id: restore
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUARRY_STORE_KEY: ${{ secrets.QUARRY_STORE_KEY }}
          BOOTSTRAP: ${{ inputs.bootstrap && '--bootstrap' || '' }}
        run: pnpm pipeline store pull --store "$STORE" --prune-list "$OUT/prune.txt" $BOOTSTRAP

      - name: Crawl
        env:
          MAX_BOARDS: ${{ inputs.max-boards }}
        run: >
          pnpm pipeline crawl --store "$STORE"
          --summary "$GITHUB_STEP_SUMMARY" --stats "$OUT/stats.json"
          ${MAX_BOARDS:+--max-boards "$MAX_BOARDS"}

      # Asked between the crawl and the pack, so the snapshot carries the answers and the index
      # below is built against them. After the pack, the answers would live only in a store file
      # the runner then throws away, and tomorrow's run would pay to ask the same questions again.
      #
      # Asked even when the crawl failed partway, for the reason the pack runs anyway: the postings
      # that were crawled are kept, and answering them now costs what answering them tomorrow
      # would.
      - name: Check whether answers can be refreshed
        id: answers
        if: ${{ !cancelled() && (inputs.dry-run || steps.restore.outcome == 'success') }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -n "${TYPESAFE_API_KEY:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TYPESAFE_API_KEY is not set, so today's postings go unanswered. The site states its own answer coverage, so this shows up as a falling figure rather than as silence."
          fi

      # A dry run needs no key, because the command reports its estimate and returns before it
      # builds a client, so the whole step can be rehearsed before the secret exists.
      - name: Answer the standard questions about new postings
        id: enrich
        if: ${{ !cancelled() && (inputs.dry-run || steps.answers.outputs.ready == 'true') }}
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          # Between 189 and 881 postings arrived per day over the first week of scheduled runs, and
          # answering one costs about $0.0000866, so a dollar is more than ten times the daily
          # need. It is a guard against a runaway rather than a working figure: a day that needs
          # more than this has something wrong with it, and the step below says so out loud.
          BUDGET: ${{ inputs.enrich-budget-usd || '1.00' }}
          DRY: ${{ inputs.dry-run && '--dry-run' || '' }}
        run: |
          set -o pipefail
          pnpm pipeline enrich --store "$STORE" --budget-usd "$BUDGET" --minutes 15 \
            --ledger "$RUNNER_TEMP/ledger.jsonl" --summary "$GITHUB_STEP_SUMMARY" $DRY \
            | tee "$RUNNER_TEMP/enrich.log"

      # `pipeline enrich` exits 0 when it stops early: it treats a cap as a boundary rather than an
      # error, and fails only when it answered nothing at all. On a daily delta, stopping early
      # means the money or the clock ran out before the new postings were answered, and the only
      # trace would be an index slightly thinner than the corpus. So the reason is read back from
      # the command's own outcome line and anything short of a finished run fails the job. A line
      # that cannot be read fails too, rather than reporting a reason nobody actually checked.
      - name: Fail if the answer run stopped short
        if: ${{ !cancelled() && !inputs.dry-run && steps.enrich.outcome == 'success' }}
        env:
          BUDGET: ${{ inputs.enrich-budget-usd || '1.00' }}
        run: |
          line=$(grep '^Answered ' "$RUNNER_TEMP/enrich.log" | tail -n 1 || true)
          reason=${line##*(}
          reason=${reason%)}
          case "$reason" in
            "nothing outstanding")
              echo "Every posting outstanding at the start of this run was answered." ;;
            budget)
              echo "::error::Answering hit its \$$BUDGET cap before covering every new posting, so this run's index is thinner than the corpus. Find out why today cost many times the usual few cents, then catch up with a manual run that sets enrich-budget-usd."
              exit 1 ;;
            deadline | limit | errors)
              echo "::error::Answering stopped early ($reason) before covering every new posting, so this run's index is thinner than the corpus."
              exit 1 ;;
            *)
              echo "::error::Could not read the outcome of the answer run, so whether it finished is unknown. Read the step above."
              exit 1 ;;
          esac

      # Packed even when the crawl failed: every board's result is committed as it completes,
      # so a partial run's progress is worth keeping.
      - name: Pack the store
        id: pack
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        env:
          QUARRY_STORE_KEY: ${{ secrets.QUARRY_STORE_KEY }}
        run: pnpm pipeline store pack --store "$STORE" --out "$OUT"

      - name: Hand the snapshot to the commit job
        if: ${{ !cancelled() && steps.pack.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-snapshot
          path: ${{ runner.temp }}/out/
          retention-days: 1
          if-no-files-found: error

      # Built here and deployed by the job below, from the same commit and the same run, so the
      # site can never go up around an index it was not built against. A build over its size
      # budgets fails the job, which a scheduled run reports like any failure.
      - name: Build the search index
        id: index
        if: ${{ !cancelled() && (inputs.dry-run || steps.restore.outcome == 'success') }}
        run: >
          pnpm pipeline index --store "$STORE" --out "$RUNNER_TEMP/search-index"
          --summary "$GITHUB_STEP_SUMMARY"

      - name: Keep the search index
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: search-index
          path: ${{ runner.temp }}/search-index/
          retention-days: 7
          if-no-files-found: error

      - name: Keep the dry run's statistics
        if: ${{ !cancelled() && inputs.dry-run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crawl-stats
          path: ${{ runner.temp }}/out/stats.json
          retention-days: 7
          if-no-files-found: warn

      - name: Check crawl health
        if: ${{ !cancelled() && (inputs.dry-run || steps.restore.outcome == 'success') }}
        run: |
          if [ ! -f "$OUT/stats.json" ] || ! jq -e \
            '.status == "succeeded" and (.successRate == null or .successRate >= 0.95)' \
            "$OUT/stats.json" > /dev/null; then
            echo "::error::The crawl failed or fewer than 95% of boards were crawled successfully."
            exit 1
          fi

  commit:
    name: Commit snapshot
    needs: crawl
    if: ${{ !cancelled() && needs.crawl.outputs.packed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Can write to the repository, so it checks out nothing and runs only the gh CLI.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: pipeline-store
    steps:
      - name: Download the snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: store-snapshot
          path: out

      - name: Upload the snapshot, then its manifest
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --prerelease --latest=false --title "Pipeline store" \
              --notes "Encrypted snapshots of the pipeline store, one per run. Not a software release."
          fi
          gh release upload "$TAG" out/store-*.sqlite.br.enc
          # Asset names are unique within a release, so if another run already committed this
          # sequence number, this upload fails instead of overwriting history.
          gh release upload "$TAG" out/manifest-*.json

      - name: Prune snapshots outside retention
        run: |
          while IFS= read -r name; do
            if [ -n "$name" ]; then gh release delete-asset "$TAG" "$name" --yes; fi
          done < out/prune.txt

  deploy:
    name: Deploy
    needs: crawl
    # Ships only a whole, healthy, real run. The crawl job succeeds only when the restore, the
    # crawl, the index build and the 95% health check all passed, and `indexed` says the index
    # itself exists. A partial crawl is still worth snapshotting, because the store accumulates
    # and the next run carries on from it, but it is not worth serving: a deploy replaces what
    # the site already shows, so a thin index would be a step backwards rather than a gap.
    if: >-
      ${{ !cancelled() && !inputs.dry-run && needs.crawl.result == 'success'
      && needs.crawl.outputs.indexed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Builds and uploads only: it reads the repository and this run's artifact, and writes
    # nothing back to the repository.
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      # The whole install, not --prod like the crawl job: the site build runs esbuild, and the
      # Worker bundle pulls in workspace packages, both of which are development dependencies.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No run id, so this is this run's own artifact: the index the crawl job built a few
      # minutes ago from the commit this job just checked out.
      - name: Download the search index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: search-index
          path: search-index

      # The site refuses an index of a format it does not read rather than misreading it, so an
      # index this commit could not open must not reach the deployment. Checked here with the
      # very parser the browser runs, which fails the job before anything is built or uploaded.
      - name: Check the index against this commit's reader
        run: >
          node --input-type=module --eval
          'import { readFile } from "node:fs/promises";
          import { parseManifest } from "./packages/search-index/src/parse.ts";
          const text = await readFile("search-index/manifest.json", "utf8");
          const found = parseManifest(JSON.parse(text));
          console.log("Index format " + found.format + ", " + found.postings
          + " postings, built " + found.builtAt + ".");'

      # Copies the index into dist/index/, where the page fetches it from. The Worker serves
      # that directory, so the page and the index it was built against go up as one version.
      - name: Build the site around the index
        run: pnpm --filter @quarry/site build --index search-index

      # Pinned like the actions above, for the same reason: this runs third-party code with a
      # token that can deploy. Bump it deliberately, and read the release notes when you do.
      - name: Deploy the Worker and the site
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 deploy

  report:
    name: Report
    needs: [crawl, commit, deploy]
    # A dry run commits nothing, so it neither raises nor clears alerts.
    if: ${{ !cancelled() && !inputs.dry-run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EVENT: ${{ github.event_name }}
      FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update, or close the failure issue
        run: |
          label=pipeline-failure
          gh label create "$label" --color B60205 \
            --description "The scheduled pipeline run failed" > /dev/null 2>&1 || true
          issue=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$FAILED" = "true" ]; then
            if [ "$EVENT" != "schedule" ]; then
              echo "A manually started run failed; alerts are only raised for scheduled runs."
            elif [ -n "$issue" ]; then
              gh issue comment "$issue" --body "Failed again: $RUN_URL"
            else
              gh issue create --label "$label" --title "Scheduled pipeline run failed" --body \
                "The daily pipeline run failed: $RUN_URL. The job summary shows which step failed, which boards could not be crawled, and whether the site was deployed. This issue closes automatically after the next successful run."
            fi
          elif [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Recovered: $RUN_URL"
            gh issue close "$issue"
          fi
