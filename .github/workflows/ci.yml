name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check typography
        run: pnpm check:text

      - name: Lint and check formatting
        run: pnpm exec biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      # Last, so an advisory does not hide the lint, typecheck and test results for the same run.
      - name: Audit production dependencies
        run: pnpm audit:prod

      # Development advisories do not ship, so they report instead of failing. They are written to
      # the run summary and raise a warning annotation so a new one cannot pass unnoticed.
      - name: Report development advisories
        run: |
          report="$(pnpm --silent audit:dev 2>&1)" || found=1
          {
            echo '### Development dependency advisories'
            echo
            if [ -n "${found:-}" ]; then
              echo 'Reported, not gated: these packages are not shipped. Production exposure is gated'
              echo 'by the `Audit production dependencies` step.'
              echo
              echo 'Expected response: upgrade the development dependency that pulls the advisory in.'
              echo 'If no patched version is installable yet, add the GHSA to `pnpm.auditConfig.ignoreGhsas`'
              echo 'in `package.json` with a reason and the condition for taking it back out.'
              echo
              echo '```text'
              printf '%s\n' "$report"
              echo '```'
            else
              echo 'No known vulnerabilities.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${found:-}" ]; then
            counts="$(printf '%s\n' "$report" | grep -E '^([0-9]+ vulnerabilit|Severity:)' | tr '\n' ' ')"
            echo "::warning title=Development dependency advisories::${counts}Not a merge blocker. See the run summary for the advisories and the expected response."
          fi
